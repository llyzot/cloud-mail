name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-03"
compatibility_flags = [ "nodejs_compat" ]
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "dab0fec3-b919-4640-a8d6-96d95fe6f66d"

[[kv_namespaces]]
binding = "kv"
id = "63be94175786432fa16efde00905cd82"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-r2"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

